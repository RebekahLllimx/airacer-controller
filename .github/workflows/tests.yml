name: Tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  offline:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: ruff check controller scripts tests experiments/figures/run3_analysis/generate_figures.py
      - run: python -m pytest -q --cov=controller --cov-report=term-missing --cov-fail-under=90
      - run: python scripts/check_public_release.py
      - run: python scripts/build_submission.py --mode no_other_cars
      - run: python scripts/build_submission.py --mode with_other_cars
      - run: python scripts/validate_submission.py submissions/no_other_cars/team_controller.py
      - run: python scripts/validate_submission.py submissions/with_other_cars/team_controller.py
